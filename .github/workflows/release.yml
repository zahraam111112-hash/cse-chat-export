name: release

# Builds the Windows app from a tag and attaches it to a GitHub Release.
#
# Chromium is bundled on purpose. `playwright install` downloads from a CDN
# that is blocked in some regions, so a release that deferred it to first
# launch would install but never extract anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install chromium
          python -m pytest tests -q

      - name: Assemble the app folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $App = "build\ChatGPT-Share-Exporter"
          New-Item -ItemType Directory -Force -Path $App | Out-Null

          Copy-Item app, windows, tests -Destination $App -Recurse
          Copy-Item run.py, run_bot.py, requirements.txt, README.md, start.cmd -Destination $App
          Copy-Item windows\README.md -Destination "$App\WINDOWS.md"

          # Wheels are resolved up front so the bundled venv can install with
          # --no-index: a build machine with no network at that point still
          # produces a complete runtime.
          python -I -m pip download -r requirements.txt -d build\wheels --only-binary=:all:
          python -I -m venv "$App\python"
          & "$App\python\Scripts\python.exe" -I -m pip install --no-index `
            --find-links build\wheels -r requirements.txt

          # PLAYWRIGHT_BROWSERS_PATH=0 puts Chromium inside the venv instead of
          # %LOCALAPPDATA%, so it travels with the folder.
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"
          & "$App\python\Scripts\python.exe" -m playwright install chromium

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $App = "build\ChatGPT-Share-Exporter"

          Compress-Archive -Path "$App\*" -DestinationPath "ChatGPT-Share-Exporter-Windows.zip"

          # Inno Setup, not IExpress: IExpress flattens every source directory
          # into one folder, which would destroy python\Lib\site-packages.
          winget install --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements
          $Iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $Iscc)) { throw "ISCC.exe not found at $Iscc" }

          & $Iscc "windows\installer.iss"
          if (-not (Test-Path "dist\ChatGPT-Share-Exporter-Setup.exe")) {
            throw "Inno Setup produced no installer"
          }

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist\ChatGPT-Share-Exporter-Setup.exe
            ChatGPT-Share-Exporter-Windows.zip
          body: |
            Windows build of ChatGPT Share Exporter.

            **Install:** download `ChatGPT-Share-Exporter-Setup.exe`, run it, and
            use the *ChatGPT Share Exporter* shortcut it creates. No administrator
            rights are needed.

            **Portable:** download `ChatGPT-Share-Exporter-Windows.zip`, unpack it
            anywhere, and run `start.cmd`.

            Chromium is bundled, so nothing is downloaded on first launch. Job
            history lives in `%LOCALAPPDATA%\ChatGPTShareExporter`, outside the
            install folder, so installing a newer build keeps it.
          generate_release_notes: true
