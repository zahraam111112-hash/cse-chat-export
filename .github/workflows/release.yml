name: release

# Builds the Windows app from a tag and attaches it to a GitHub Release.
#
# No browser is bundled. Extraction and PDF export drive the Chromium the
# machine already has — Microsoft Edge ships with Windows 10 and 11 — over the
# DevTools protocol, so the payload is a Python runtime and a handful of wheels
# instead of ~700 MB of Chromium plus the 117 MB Playwright driver. That is
# roughly 14 MB to download instead of 290 MB, and nothing is fetched at
# install time or on first launch.
#
# An earlier build did bundle Chromium: `playwright install` fetches from a CDN
# that is blocked in some regions, so deferring it to first launch would have
# installed an app that never extracted anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt pytest
          python -m pytest tests -q

      - name: Assemble the app folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # A short root on purpose: the install folder ends up under
          # %LOCALAPPDATA%, and a deep runner path on top of it reaches
          # MAX_PATH.
          $App = "C:\cse-app"
          Remove-Item -Recurse -Force $App -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $App | Out-Null

          # tests/ stays behind: it runs above, and a user's install folder is
          # no place for it.
          Copy-Item app, windows -Destination $App -Recurse
          Copy-Item run.py, run_bot.py, requirements-windows.txt, README.md, start.cmd -Destination $App

          # An embeddable interpreter, not a venv. A venv's python.exe is a
          # redirector to the base interpreter it was created from, so it works
          # on the build machine and nowhere else; the embeddable build is a
          # self-contained python.exe that can be moved.
          $Py = "$App\python"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip" `
            -OutFile "$env:TEMP\py-embed.zip"
          Expand-Archive -Path "$env:TEMP\py-embed.zip" -DestinationPath $Py

          # The embeddable build starts with no site-packages and no pip; the
          # ._pth file is what enables both.
          Set-Content "$Py\python312._pth" @(
            "python312.zip",
            ".",
            "Lib\site-packages",
            "import site"
          )

          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "$env:TEMP\get-pip.py"
          & "$Py\python.exe" "$env:TEMP\get-pip.py" --no-warn-script-location
          & "$Py\python.exe" -m pip install --no-warn-script-location -r requirements-windows.txt

          # pip is how the dependencies got here, not something the release
          # needs: it is ~8 MB of wheels nobody will install from, and Scripts\
          # holds its entry points. The bytecode caches are rebuilt on first
          # use. About 4 MB off the download in total.
          Remove-Item -Recurse -Force "$Py\Scripts" -ErrorAction SilentlyContinue
          Get-ChildItem "$Py\Lib\site-packages" -Filter "pip*" -Force |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $App -Recurse -Directory -Filter "__pycache__" |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $App -Recurse -File -Filter "*.pyc" |
            Remove-Item -Force -ErrorAction SilentlyContinue

          $Mb = [math]::Round(((Get-ChildItem $App -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "payload: $Mb MB"

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $App = "C:\cse-app"

          Compress-Archive -Path "$App\*" -DestinationPath "ChatGPT-Share-Exporter-Windows.zip" `
            -CompressionLevel Optimal

          # Inno Setup, not IExpress: IExpress flattens every source directory
          # into one folder, which would destroy python\Lib\site-packages.
          winget install --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements
          $Iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $Iscc)) { throw "ISCC.exe not found at $Iscc" }

          # The tag is the source of truth for the version Add/Remove Programs
          # shows; a manual run falls back to the script's default.
          $Version = "1.0.0"
          if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $Version = $Matches[1] }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          & $Iscc "/DSourceRoot=$App" "/DAppVersion=$Version" "/O$PWD\dist" "windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }
          if (-not (Test-Path "dist\ChatGPT-Share-Exporter-Setup.exe")) {
            throw "Inno Setup produced no installer"
          }

          Get-ChildItem dist, ChatGPT-Share-Exporter-Windows.zip |
            ForEach-Object { "{0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist\ChatGPT-Share-Exporter-Setup.exe
            ChatGPT-Share-Exporter-Windows.zip
          body: |
            Windows build of ChatGPT Share Exporter.

            **Install:** download `ChatGPT-Share-Exporter-Setup.exe`, run it, and
            use the *ChatGPT Share Exporter* shortcut it creates. No administrator
            rights are needed.

            **Portable:** download `ChatGPT-Share-Exporter-Windows.zip`, unpack it
            anywhere, and run `start.cmd`.

            Extraction and PDF export run in headless Microsoft Edge, which is
            already part of Windows 10 and 11, so no browser is downloaded at
            install time or on first launch. Google Chrome is used if Edge is
            missing; set `CSE_BROWSER` to the full path of another Chromium-based
            browser to use that instead.

            Job history lives in `%LOCALAPPDATA%\ChatGPTShareExporter`, outside
            the install folder, so installing a newer build keeps it.
          generate_release_notes: true
