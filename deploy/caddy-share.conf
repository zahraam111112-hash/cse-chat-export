# ChatGPT Share Exporter — dedicated host.
# DNS: cse.<your-domain> -> <origin-ip> (Dynadot A record).
# Auth is enforced inside the app (CSE_AUTH_USER/PASS), not by the site's
# shared basic_auth wall, so this subdomain gets its own password.
cse.<your-domain> {
	reverse_proxy 127.0.0.1:8098 {
		header_up Host {host}
		header_up X-Real-IP {remote_host}
	}

	request_body {
		max_size 2MB
	}

	encode gzip zstd

	log {
		output file /var/log/caddy/access.log
		format json
	}

	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Content-Type-Options "nosniff"
		Referrer-Policy "strict-origin-when-cross-origin"
		-Server
	}
}
