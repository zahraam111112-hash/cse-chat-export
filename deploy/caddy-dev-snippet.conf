# ── ChatGPT Share Exporter (mounted under an existing dev site) ──
# Placeholders: generate the bcrypt hash with `caddy hash-password`, and
# take the bearer token from whatever serves :8010. Never commit real ones.
# The app serves from the root of its own process; Caddy strips the prefix
# so every relative URL in the page keeps working under /chatgpt-export/.
dev.<your-domain> {
	basic_auth {
		admin $2a$14$<bcrypt-hash-of-your-password>
	}

	redir /chatgpt-export /chatgpt-export/ 308

	handle_path /chatgpt-export/* {
		reverse_proxy 127.0.0.1:8098 {
			header_up Host {host}
			header_up X-Real-IP {remote_host}
			header_up X-Forwarded-For {remote_host}
			header_up X-Forwarded-Proto {scheme}
		}
		encode gzip zstd
	}

	handle {
		reverse_proxy 127.0.0.1:8010 {
			header_up Host {host}
			header_up X-Real-IP {remote_host}
			header_up X-Forwarded-For {remote_host}
			header_up X-Forwarded-Proto {scheme}
			header_up Authorization "Bearer <your-token>"
		}
		encode gzip zstd
	}

	log {
		output file /var/log/caddy/access.log
		format json
	}

	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Content-Type-Options "nosniff"
		-Server
	}
}
